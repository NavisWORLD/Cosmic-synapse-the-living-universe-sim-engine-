name: Bug report
description: Report a reproducible SIM EARTH 7.07 problem
title: "[BUG] "
labels: [bug]
body:
  - type: textarea
    attributes: { label: What happened? }
    validations: { required: true }
  - type: textarea
    attributes: { label: Reproduction steps }
    validations: { required: true }
  - type: input
    attributes: { label: Device / browser / OS }
  - type: checkboxes
    attributes:
      label: Claim type
      options:
        - label: This is an implementation/runtime bug, not a request to promote a research hypothesis to fact.
