name: Build SIM EARTH 7.08 Reality Body
on:
  push:
    branches: [agent/reality-body-708]
    paths: ['.build708/READY']
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - run: npm install --no-audit --no-fund
      - run: npm run verify && npm run prepare:web
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SIM-EARTH-7.08-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
      - run: npm run verify && npm run prepare:web
      - run: npx cap add ios
      - run: npx cap sync ios
      - name: Build unsigned simulator app
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath ios-build CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator build
        run: ditto -c -k --sequesterRsrc --keepParent ios-build/Build/Products/Debug-iphonesimulator/App.app SIM-EARTH-7.08-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SIM-EARTH-7.08-iOS-Simulator
          path: SIM-EARTH-7.08-iOS-Simulator.zip
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
      - run: npm run verify && npm run prepare:web
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: SIM-EARTH-7.08-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
  cleanup:
    needs: [android, ios, desktop]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove one-shot build trigger
        run: |
          rm -rf .build708
          rm -f .github/workflows/build-reality-708.yml
          git config user.name "NavisWORLD"
          git config user.email "200881305+NavisWORLD@users.noreply.github.com"
          git add -A
          git commit -m "record completed 7.08 native build pass"
          git push
