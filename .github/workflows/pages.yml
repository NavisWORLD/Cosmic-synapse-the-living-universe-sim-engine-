name: Deploy PWA to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install the cartridge compiler
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm gcc libmgba-dev
      - run: npm run verify
      - run: npm run test:link
      - name: Verify exact recorded IBM source admission before publishing
        run: node --test arcade/sol-spark-gate/*cartridge-source.test.mjs
      - run: npm run build:cartridge
      - name: Boot past map building with a Spark cage save
        run: python3 gba/lost-cosmos-living-multiverse/tests/test_mgba_cage_overworld.py --rom arcade/lost-cosmos/rom/lost-cosmos.gba --elf gba/lost-cosmos-living-multiverse/LOST_COSMOS_V10_SOURCE/lost_cosmos_v5.elf --out /tmp/mgba-cage-overworld
      - name: Install headless Chromium
        run: npm install --no-save playwright@1.55.1 && npx playwright install --with-deps chromium
      - name: Boot the vendored GBA emulator
        run: npm run test:emulator
      - run: npm run prepare:web
      - run: npm run verify:web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: app }
      - id: deployment
        uses: actions/deploy-pages@v4
