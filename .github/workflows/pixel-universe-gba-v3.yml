name: Lost COSMOS GBA V3 RPG verification
permissions:
  contents: write

on:
  push:
    branches: [ feature/pixel-universe-gba-rpg-003 ]
    paths:
      - 'gba/lost-cosmos-v3/**'
      - '.github/workflows/pixel-universe-gba-v3.yml'
  pull_request:
    paths:
      - 'gba/lost-cosmos-v3/**'
      - '.github/workflows/pixel-universe-gba-v3.yml'

jobs:
  build-and-emulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact V3 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .src/lost-cosmos-v3 .qa/lost-cosmos-v3
          # Use the actual editable branch source. The bootstrap archive is
          # only a fallback for historical commits that lacked published source.
          if [[ -f gba/lost-cosmos-v3/lost_cosmos_v3.c ]]; then
            cp -a gba/lost-cosmos-v3/. .src/lost-cosmos-v3/
            rm -rf .src/lost-cosmos-v3/bootstrap
          else
            cat gba/lost-cosmos-v3/bootstrap/source.zip.b64.* | tr -d '\n' | base64 -d > /tmp/lost-cosmos-v3-source.zip
            unzip -q /tmp/lost-cosmos-v3-source.zip -d .src/lost-cosmos-v3
          fi
          echo '3d9b4caf42dded4bf2345a9ced987604cb702e325239dfe79999df16ad31e1cd  .src/lost-cosmos-v3/lost_cosmos_v3.c' | sha256sum -c -
          cp -a .src/lost-cosmos-v3/. .qa/lost-cosmos-v3/
          (cd .src/lost-cosmos-v3 && zip -q -r ../../.qa/lost-cosmos-v3/source.zip . -x '*.o' '*.elf' '*.gba' '*.sav')

      - name: Install ARM build and mGBA
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm mgba-sdl xvfb

      - name: Build and validate release RPG
        working-directory: .qa/lost-cosmos-v3
        run: |
          set -euo pipefail
          chmod +x build_v3.sh
          ./build_v3.sh
          python verify_routes.py
          python host_qa_v3.py
          cp SIM_EARTH_PIXEL_UNIVERSE_LOST_COSMOS_V3.gba release.gba
          sha256sum release.gba > release.gba.sha256

      - name: Build isolated QA emulator cartridge
        working-directory: .qa/lost-cosmos-v3
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path("lost_cosmos_v3.c")
          s=p.read_text()
          old="void gba_main(void){u16 k,newk;init_new_game();load_game();init_graphics();sound_init();if(game_mode==MODE_SPACE)generate_space();else generate_surface();"
          new="""void gba_main(void){u16 k,newk;init_new_game();load_game();
          #ifdef QA_AUTORUN
           SRAM[126]=0xD1; SRAM[127]=0xA1; save_game();
          #endif
           init_graphics();
          #ifdef QA_AUTORUN
           SRAM[126]=0xD2; SRAM[127]=0xA2; save_game();
          #endif
           sound_init();if(game_mode==MODE_SPACE)generate_space();else generate_surface();
          #ifdef QA_AUTORUN
           SRAM[126]=0xD3; SRAM[127]=0xA3; save_game();
          #endif
          """
          if old not in s: raise SystemExit("gba_main instrumentation target missing")
          p.write_text(s.replace(old,new))
          PY
          QA=1 ./build_v3.sh
          cp SIM_EARTH_PIXEL_UNIVERSE_LOST_COSMOS_V3.gba qa.gba
          rm -f qa.sav qa-boot1.sav qa-final.sav

      - name: mGBA boot 1 - combat, Ember gear, level, save
        working-directory: .qa/lost-cosmos-v3
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 640x480x24 -nolisten tcp >xvfb-boot1.log 2>&1 &
          XPID=$!
          export DISPLAY=:99
          sleep 1
          mgba -C savegamePath="$PWD" -C audioSync=0 -C videoSync=0 qa.gba >mgba-boot1.log 2>&1 &
          MPID=$!
          sleep 4
          kill -TERM "$MPID" 2>/dev/null || true
          for i in $(seq 1 20); do kill -0 "$MPID" 2>/dev/null || break; sleep 0.1; done
          kill -KILL "$MPID" 2>/dev/null || true
          wait "$MPID" 2>/dev/null || true
          kill -TERM "$XPID" 2>/dev/null || true
          wait "$XPID" 2>/dev/null || true
          test -s qa.sav || { cat mgba-boot1.log; exit 1; }
          python - <<'PY'
          from pathlib import Path
          p=Path('qa.sav').read_bytes()
          assert len(p)==32768, len(p)
          assert p[:4]==b'LCV3', p[:8]
          if p[126]!=0xA5: raise AssertionError(f'boot1 marker={p[126]:#x} stage={p[127]:#x}')
          assert p[5]&1 and p[11]==1 and p[128]>=2 and p[143]==1,(p[5],p[11],p[128],p[143])
          assert p[142]&2,(p[142],)
          print(f'PASS real mGBA V3 boot1 | level={p[128]} weapon={p[143]} gear={p[142]:#x}')
          PY
          cp qa.sav qa-boot1.sav
          sha256sum qa-boot1.sav > sram-boot1.sha256

      - name: mGBA boot 2 - Y/Z gear, Crown Edge, ending, postgame
        working-directory: .qa/lost-cosmos-v3
        shell: bash
        run: |
          set -euo pipefail
          test -s qa.sav
          Xvfb :99 -screen 0 640x480x24 -nolisten tcp >xvfb-boot2.log 2>&1 &
          XPID=$!
          export DISPLAY=:99
          sleep 1
          mgba -C savegamePath="$PWD" -C audioSync=0 -C videoSync=0 qa.gba >mgba-boot2.log 2>&1 &
          MPID=$!
          sleep 4
          kill -TERM "$MPID" 2>/dev/null || true
          for i in $(seq 1 20); do kill -0 "$MPID" 2>/dev/null || break; sleep 0.1; done
          kill -KILL "$MPID" 2>/dev/null || true
          wait "$MPID" 2>/dev/null || true
          kill -TERM "$XPID" 2>/dev/null || true
          wait "$XPID" 2>/dev/null || true
          test -s qa.sav || { cat mgba-boot2.log; exit 1; }
          python - <<'PY'
          from pathlib import Path
          p=Path('qa.sav').read_bytes()
          assert len(p)==32768, len(p)
          assert p[:4]==b'LCV3', p[:8]
          if p[126]!=0x5A: raise AssertionError(f'boot2 marker={p[126]:#x} stage={p[127]:#x}')
          assert p[5]==7 and p[11]==5 and p[128]>=3,(p[5],p[11],p[128])
          assert p[143]==2 and p[144]==1 and p[145]==1,(p[143],p[144],p[145])
          assert (p[142]&0x1f)==0x1f,hex(p[142])
          assert p[9] and p[10],(p[9],p[10])
          print(f'PASS real mGBA V3 boot2 | level={p[128]} gear={p[143:146].hex()} ending={p[9]} postgame={p[10]}')
          PY
          cp qa.sav qa-final.sav
          sha256sum qa-final.sav > sram-boot2.sha256

      - name: Publish verified editable V3 source
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf gba/lost-cosmos-v3
          mkdir -p gba/lost-cosmos-v3
          cp -a .src/lost-cosmos-v3/. gba/lost-cosmos-v3/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A gba/lost-cosmos-v3
          git diff --cached --quiet && exit 0
          git commit -m "publish verified Lost COSMOS V3 RPG source [skip ci]"
          git push origin HEAD:feature/pixel-universe-gba-rpg-003

      - name: Upload verified ROM and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lost-cosmos-gba-v3-rpg
          path: |
            .qa/lost-cosmos-v3/release.gba
            .qa/lost-cosmos-v3/release.gba.sha256
            .qa/lost-cosmos-v3/source.zip
            .qa/lost-cosmos-v3/*boot*.log
            .qa/lost-cosmos-v3/*.sav
            .qa/lost-cosmos-v3/*.sha256
