name: Bootstrap canonical standalone
on:
  push:
    paths:
      - '.source-chunks/**'
      - '.github/workflows/bootstrap-standalone.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble canonical engine
        run: |
          mkdir -p standalone
          cat .source-chunks/part-*.b64 | base64 -d | gunzip > standalone/SIM_EARTH_7_07_ALIEN_CONTROL_CENTER.html
          echo "62a2bb449abc28a0860fdaeec15ba4c5b53ae8199679029f97e7270cb4a90647  standalone/SIM_EARTH_7_07_ALIEN_CONTROL_CENTER.html" | sha256sum -c -
      - name: Commit canonical engine and remove bootstrap
        run: |
          rm -rf .source-chunks
          git rm -f .github/workflows/bootstrap-standalone.yml
          git add standalone/SIM_EARTH_7_07_ALIEN_CONTROL_CENTER.html
          git config user.name "SIM EARTH 7.07 Builder"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "add canonical SIM EARTH 7.07 engine"
          git push
