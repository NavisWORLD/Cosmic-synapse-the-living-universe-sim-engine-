name: Magmascale third real measured native GBA acceptance
on:
  pull_request:
    paths:
      - 'arcade/spark-beasts/runs.mjs'
      - 'arcade/spark-beasts/data/ibm-magmascale-20261009-supplement.json'
      - 'arcade/sol-spark-gate/fixtures/ibm-magmascale-20261009*'
      - 'arcade/sol-spark-gate/ibm-magmascale-cartridge-source.test.mjs'
      - '.github/workflows/native-magmascale-source.yml'
permissions:
  contents: read
jobs:
  strict-third-native-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Three authenticated IBM measured-seed identities, strict tamper rejection
        run: |
          node --check arcade/spark-beasts/runs.mjs
          node --test arcade/sol-spark-gate/ibm-magmascale-cartridge-source.test.mjs arcade/sol-spark-gate/ibm-pistonwyrm-cartridge-source.test.mjs arcade/sol-spark-gate/ibm-final-live-cartridge-source.test.mjs arcade/sol-spark-gate/ibm-marrakesh-cartridge-source.test.mjs
