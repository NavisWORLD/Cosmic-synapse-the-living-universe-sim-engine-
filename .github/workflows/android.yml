name: Android application
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - run: npm install --no-audit --no-fund
      - run: npm run verify && npm run prepare:web
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build installable test APK and release package surfaces
        run: cd android && ./gradlew assembleDebug assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: SIM-EARTH-7.08-Android-application
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
