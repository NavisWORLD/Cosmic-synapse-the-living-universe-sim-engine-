name: Signed mobile release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to receive signed assets
        required: true
        default: v7.0.8

permissions:
  contents: write

jobs:
  android-signed:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - run: npm install --no-audit --no-fund
      - run: npm run verify && npm run prepare:web
      - run: npx cap add android && npx cap sync android
      - name: Require Android publisher signing secrets
        shell: bash
        run: |
          set -euo pipefail
          for value in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!value:-}" ]; then
              echo "Missing GitHub secret: $value" >&2
              exit 1
            fi
          done
      - name: Build and sign Android release APK/AAB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-mobile
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/sim-earth-release.keystore
          (cd android && ./gradlew assembleRelease bundleRelease)

          APK="$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          AAB="$(find android/app/build/outputs/bundle/release -type f -name '*.aab' | head -n 1)"
          test -n "$APK" && test -n "$AAB"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$APK" /tmp/SIM_EARTH_7_08_Android_Release-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/sim-earth-release.keystore \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out release-mobile/SIM_EARTH_7_08_Android_Release.apk \
            /tmp/SIM_EARTH_7_08_Android_Release-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose release-mobile/SIM_EARTH_7_08_Android_Release.apk

          cp "$AAB" release-mobile/SIM_EARTH_7_08_Android_Release.aab
          jarsigner \
            -keystore /tmp/sim-earth-release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            release-mobile/SIM_EARTH_7_08_Android_Release.aab \
            "$ANDROID_KEY_ALIAS"
          jarsigner -verify release-mobile/SIM_EARTH_7_08_Android_Release.aab
          sha256sum release-mobile/* > release-mobile/SHA256SUMS-ANDROID-SIGNED.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SIM-EARTH-7.08-Android-signed
          path: release-mobile/*
      - name: Attach signed Android assets to GitHub Release
        shell: bash
        run: gh release upload '${{ inputs.release_tag }}' release-mobile/* --clobber

  ios-signed:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
      IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
      IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
      - run: npm run verify && npm run prepare:web
      - run: npx cap add ios && npx cap sync ios
      - name: Require Apple publisher signing secrets
        shell: bash
        run: |
          set -euo pipefail
          for value in IOS_CERT_P12_BASE64 IOS_CERT_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_TEAM_ID IOS_EXPORT_OPTIONS_PLIST_BASE64; do
            if [ -z "${!value:-}" ]; then
              echo "Missing GitHub secret: $value" >&2
              exit 1
            fi
          done
      - name: Install certificate and provisioning profile
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN=/tmp/sim-earth-build.keychain-db
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$IOS_CERT_P12_BASE64" | base64 -d > /tmp/distribution.p12
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > /tmp/profile.mobileprovision
          printf '%s' "$IOS_EXPORT_OPTIONS_PLIST_BASE64" | base64 -d > /tmp/ExportOptions.plist

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import /tmp/distribution.p12 -P "$IOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security cms -D -i /tmp/profile.mobileprovision > /tmp/profile.plist
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist)"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist)"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp /tmp/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
      - name: Archive and export signed iOS IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios-build/export release-mobile
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ios-build/SIM_EARTH_7_08.xcarchive \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive
          xcodebuild -exportArchive \
            -archivePath ios-build/SIM_EARTH_7_08.xcarchive \
            -exportPath ios-build/export \
            -exportOptionsPlist /tmp/ExportOptions.plist
          IPA="$(find ios-build/export -type f -name '*.ipa' | head -n 1)"
          test -n "$IPA"
          cp "$IPA" release-mobile/SIM_EARTH_7_08_iOS_Release.ipa
          shasum -a 256 release-mobile/SIM_EARTH_7_08_iOS_Release.ipa > release-mobile/SHA256SUMS-IOS-SIGNED.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SIM-EARTH-7.08-iOS-signed
          path: release-mobile/*
      - name: Attach signed iOS assets to GitHub Release
        shell: bash
        run: gh release upload '${{ inputs.release_tag }}' release-mobile/* --clobber
