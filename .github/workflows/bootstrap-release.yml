name: Materialize canonical universe sources
on:
  push:
    branches: [main]
    paths: ['.bootstrap/**']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Reconstruct exact HTML ancestry and Ultimate engine
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/engine.b64.* | base64 -d | gzip -d > REALITY_BRIDGE_UNIVERSE_ENGINE_ULTIMATE.html
          mkdir -p archive
          cat .bootstrap/archive.b64.* | base64 -d | gzip -d > archive/SIM_EARTH_7_07_ALIEN_CONTROL_CENTER.html
          echo "591bdbb931264e26b583747099bcc251b8161a4b62b02ed44e88b077eea2b7bc  REALITY_BRIDGE_UNIVERSE_ENGINE_ULTIMATE.html" | sha256sum -c -
          echo "62a2bb449abc28a0860fdaeec15ba4c5b53ae8199679029f97e7270cb4a90647  archive/SIM_EARTH_7_07_ALIEN_CONTROL_CENTER.html" | sha256sum -c -
          node scripts/sync-engine.mjs
          rm -rf .bootstrap
      - name: Commit materialized source files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize full living universe engine sources"
          git push
