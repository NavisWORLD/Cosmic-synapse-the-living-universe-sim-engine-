name: Lost COSMOS GBA V2
permissions:
  contents: write
on:
  push:
    branches: [ feature/pixel-universe-gba-exploration-002 ]
    paths:
      - 'gba/lost-cosmos-v2/**'
      - '.github/workflows/pixel-universe-gba-v2.yml'
  pull_request:
    paths:
      - 'gba/lost-cosmos-v2/**'
      - '.github/workflows/pixel-universe-gba-v2.yml'

jobs:
  build-and-emulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover final editable V2 source
        shell: bash
        run: |
          set -euo pipefail
          SRC=gba/lost-cosmos-v2
          if [[ ! -f "$SRC/lost_cosmos_v2.c" ]]; then
            echo "BOOTSTRAPPED=1" >> "$GITHUB_ENV"
            cat "$SRC"/bootstrap/source.zip.b64.* | tr -d '\n' | base64 -d >/tmp/lost-cosmos-v2-source.zip
            unzip -q /tmp/lost-cosmos-v2-source.zip -d "$SRC"
            python "$SRC/bootstrap/finalize.py"
            cp "$SRC/bootstrap/host_qa.py" "$SRC/host_qa.py"
            rm -f "$SRC/pixel-universe-gba-v2.yml"
          else
            echo "BOOTSTRAPPED=0" >> "$GITHUB_ENV"
          fi
      - name: Install ARM build and emulator QA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm mgba-sdl xvfb
      - name: Stage V2 source
        run: |
          mkdir -p .qa/lost-cosmos-v2
          cp -a gba/lost-cosmos-v2/. .qa/lost-cosmos-v2/
          rm -rf .qa/lost-cosmos-v2/bootstrap
      - name: Build and statically verify release
        working-directory: .qa/lost-cosmos-v2
        run: |
          chmod +x build_v2.sh
          ./build_v2.sh
          python verify_routes.py
          python host_qa.py
          cp SIM_EARTH_PIXEL_UNIVERSE_LOST_COSMOS_V2.gba release.gba
          sha256sum release.gba > release.gba.sha256
      - name: Build emulator autorun ROM
        working-directory: .qa/lost-cosmos-v2
        run: |
          QA=1 ./build_v2.sh
          cp SIM_EARTH_PIXEL_UNIVERSE_LOST_COSMOS_V2.gba qa.gba
          cp lost_cosmos_v2.elf qa.elf
          rm -f qa.sav qa-final.sav
      - name: mGBA boot 1 — Origin, interior, ship, Ember X, SRAM
        working-directory: .qa/lost-cosmos-v2
        shell: bash
        run: |
          set -euo pipefail
          rm -f qa.sav qa-boot1.sav
          Xvfb :99 -screen 0 640x480x24 -nolisten tcp >xvfb-boot1.log 2>&1 &
          XPID=$!
          export DISPLAY=:99
          sleep 1
          mgba -C savegamePath="$PWD" -C audioSync=0 -C videoSync=0 qa.gba >mgba-boot1.log 2>&1 &
          MPID=$!
          sleep 4
          kill -TERM "$MPID" 2>/dev/null || true
          for i in $(seq 1 20); do
            kill -0 "$MPID" 2>/dev/null || break
            sleep 0.1
          done
          kill -KILL "$MPID" 2>/dev/null || true
          wait "$MPID" 2>/dev/null || true
          kill -TERM "$XPID" 2>/dev/null || true
          wait "$XPID" 2>/dev/null || true
          if [[ ! -s qa.sav ]]; then
            echo 'mGBA did not create qa.sav in forced savegamePath'; find "$PWD" "$HOME/.config/mgba" -maxdepth 3 -type f -name '*.sav' -ls 2>/dev/null || true
            cat mgba-boot1.log || true
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          p=Path("qa.sav").read_bytes()
          assert len(p)==32768, len(p)
          if p[0x7e]!=0xA5:
              raise AssertionError(f"boot1 marker={p[0x7e]:#x} stage={p[0x7f]:#x}")
          print("PASS mGBA boot 1: SRAM marker",hex(p[0x7e]),"stage",hex(p[0x7f]))
          PY
          cp qa.sav qa-boot1.sav
          sha256sum qa.sav >sram-boot1.sha256
      - name: mGBA boot 2 — SRAM reload, Y/Z, Black Garden, Crown, postgame
        working-directory: .qa/lost-cosmos-v2
        shell: bash
        run: |
          set -euo pipefail
          test -s qa.sav
          Xvfb :99 -screen 0 640x480x24 -nolisten tcp >xvfb-boot2.log 2>&1 &
          XPID=$!
          export DISPLAY=:99
          sleep 1
          mgba -C savegamePath="$PWD" -C audioSync=0 -C videoSync=0 qa.gba >mgba-boot2.log 2>&1 &
          MPID=$!
          sleep 4
          kill -TERM "$MPID" 2>/dev/null || true
          for i in $(seq 1 20); do
            kill -0 "$MPID" 2>/dev/null || break
            sleep 0.1
          done
          kill -KILL "$MPID" 2>/dev/null || true
          wait "$MPID" 2>/dev/null || true
          kill -TERM "$XPID" 2>/dev/null || true
          wait "$XPID" 2>/dev/null || true
          test -s qa.sav
          python - <<'PY'
          from pathlib import Path
          p=Path("qa.sav").read_bytes()
          assert len(p)==32768, len(p)
          if p[0x7e]!=0x5A:
              raise AssertionError(f"boot2 marker={p[0x7e]:#x} stage={p[0x7f]:#x}")
          assert (p[6] & 0x07)==0x07, hex(p[6])
          assert p[7] != 0, p[7]
          assert p[8] != 0, p[8]
          print("PASS mGBA boot 2: marker",hex(p[0x7e]),"keys",hex(p[6]),"ending",p[7],"postgame",p[8])
          PY
          cp qa.sav qa-final.sav
          sha256sum qa.sav >sram-boot2.sha256
      - name: Publish verified editable source to development branch
        if: env.BOOTSTRAPPED == '1' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf gba/lost-cosmos-v2/bootstrap
          rm -rf .bootstrap/lost-cosmos-v2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A gba/lost-cosmos-v2 .bootstrap/lost-cosmos-v2
          git diff --cached --quiet && exit 0
          git commit -m "publish verified Lost COSMOS V2 editable GBA source"
          git push origin HEAD:feature/pixel-universe-gba-exploration-002
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lost-cosmos-gba-v2
          path: |
            .qa/lost-cosmos-v2/release.gba
            .qa/lost-cosmos-v2/release.gba.sha256
            .qa/lost-cosmos-v2/*boot*.log
            .qa/lost-cosmos-v2/*.sav
            .qa/lost-cosmos-v2/*.sha256
