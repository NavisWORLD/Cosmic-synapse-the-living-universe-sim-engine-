name: iOS application
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
      - run: npm run verify && npm run prepare:web
      - run: npx cap add ios
      - run: npx cap sync ios
      - name: Build release-configuration Simulator application
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -derivedDataPath ios-build CODE_SIGNING_ALLOWED=NO build
      - name: Package Simulator .app
        run: ditto -c -k --sequesterRsrc --keepParent ios-build/Build/Products/Release-iphonesimulator/App.app SIM-EARTH-7.08-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SIM-EARTH-7.08-iOS-application
          path: SIM-EARTH-7.08-iOS-Simulator.zip
          if-no-files-found: error
