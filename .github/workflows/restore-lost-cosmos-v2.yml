name: Restore and verify Lost COSMOS GBA V2
on:
  push:
    branches: [ feature/pixel-universe-gba-exploration-002 ]
    paths:
      - '.bootstrap/lost-cosmos-v2-canonical/**'
      - 'gba/lost-cosmos-v2/**'
      - '.github/workflows/restore-lost-cosmos-v2.yml'

permissions:
  contents: write

jobs:
  restore-build-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pixel-universe-gba-exploration-002
          fetch-depth: 0

      - name: Restore exact source archive when bootstrap is present
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G '.bootstrap/lost-cosmos-v2-canonical/source.b64.*' >/dev/null; then
            cat .bootstrap/lost-cosmos-v2-canonical/source.b64.* | base64 -d > /tmp/lost-cosmos-v2.zip
            echo "c6902148e523fabf6e3d35dc268068134b564dd33b76553656a22ae46cbc5a0c  /tmp/lost-cosmos-v2.zip" | sha256sum -c -
            rm -rf gba/lost-cosmos-v2
            mkdir -p gba/lost-cosmos-v2
            unzip -q /tmp/lost-cosmos-v2.zip -d gba/lost-cosmos-v2
            chmod +x gba/lost-cosmos-v2/build_v2.sh
            rm -rf .bootstrap/lost-cosmos-v2-canonical .bootstrap/lost-cosmos-v2 || true
          else
            test -f gba/lost-cosmos-v2/lost_cosmos_v2.c
            test -f gba/lost-cosmos-v2/qseed.h
            chmod +x gba/lost-cosmos-v2/build_v2.sh
            echo "Canonical source tree already restored."
          fi

      - name: Commit recovered source tree if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Restore Lost COSMOS GBA V2 exploration source"
            git push origin HEAD:feature/pixel-universe-gba-exploration-002
          fi

      - name: Install ARM QA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm binutils xvfb

      - name: Rebuild and static verification
        working-directory: gba/lost-cosmos-v2
        run: |
          ./build_v2.sh
          python3 verify_v2.py
          python3 verify_routes.py
          sha256sum SIM_EARTH_PIXEL_UNIVERSE_LOST_COSMOS_V2.gba | tee release-rom.sha256

      - name: mGBA two-boot SRAM QA when available
        working-directory: gba/lost-cosmos-v2
        shell: bash
        run: |
          set -euo pipefail
          if ! apt-cache show mgba-sdl >/dev/null 2>&1; then
            echo "mgba-sdl unavailable on this runner; emulator QA skipped."
            exit 0
          fi
          sudo apt-get install -y mgba-sdl
          QA=1 ./build_v2.sh
          cp SIM_EARTH_PIXEL_UNIVERSE_LOST_COSMOS_V2.gba qa.gba
          rm -f qa.sav

          run_boot () {
            expected_dec="$1"
            log="$2"
            set +e
            timeout -k 2s 8s xvfb-run -a mgba qa.gba >"$log" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ] && [ "$rc" -ne 143 ]; then
              echo "mGBA exited unexpectedly with code $rc"
              cat "$log"
              exit "$rc"
            fi
            for i in $(seq 1 20); do
              [ -s qa.sav ] && break
              sleep 0.25
            done
            test -s qa.sav
            python3 - "$expected_dec" <<'PY'
import pathlib, sys
expected=int(sys.argv[1])
p=pathlib.Path("qa.sav")
b=p.read_bytes()
assert len(b) >= 127, f"SRAM too short: {len(b)}"
actual=b[126]
print(f"SRAM stage marker: 0x{actual:02X}; expected 0x{expected:02X}; size={len(b)}")
assert actual == expected, (actual, expected)
PY
          }

          run_boot 165 mgba-boot1.log
          sha256sum qa.sav | tee sram-boot1.sha256
          run_boot 90 mgba-boot2.log
          sha256sum qa.sav | tee sram-boot2.sha256
          echo "PASS: mGBA booted QA ROM twice and SRAM persisted from stage A5 to stage 5A."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lost-cosmos-gba-v2-qa
          path: |
            gba/lost-cosmos-v2/SIM_EARTH_PIXEL_UNIVERSE_LOST_COSMOS_V2.gba
            gba/lost-cosmos-v2/*.log
            gba/lost-cosmos-v2/qa.sav
            gba/lost-cosmos-v2/*.sha256
