name: Apply SIM EARTH 7.08 UI Graphics Hotfix

on:
  push:
    branches: ['agent/ui-graphics-hotfix-708']
    paths: ['.github/workflows/apply-hotfix-708.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct exact hotfix source
        run: python .hotfix708/apply.py
      - name: Parse active JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in .hotfix708/js-check/*.js; do
            node --check "$file"
          done
      - name: Verify engine and prepare PWA
        run: |
          npm run verify
          npm run prepare:web
      - name: Commit clean hotfix tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .hotfix708
          rm .github/workflows/apply-hotfix-708.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix dynamic graphics and closable SIM EARTH UI'
          git push
