name: Lost COSMOS native build and controller QA
on:
  push:
    branches: [feature/lost-cosmos-living-multiverse-recovery-011]
    paths: ['gba/lost-cosmos-living-multiverse/**', '.github/workflows/lost-cosmos-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gba/lost-cosmos-living-multiverse
    steps:
      - uses: actions/checkout@v4
      - name: Install native compiler and official mGBA library
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm libmgba-dev ffmpeg gcc python3-pil
      - name: Build the real ARM7TDMI ROM
        run: cd LOST_COSMOS_V10_SOURCE && bash build_v5.sh
      - name: Verify reproducible build
        run: |
          sha256sum LOST_COSMOS_V10_SOURCE/LOST_COSMOS_V10_OPENING_QA.gba > /tmp/first-native.sha256
          (cd LOST_COSMOS_V10_SOURCE && bash build_v5.sh)
          sha256sum --check /tmp/first-native.sha256
      - name: Package the public-safe editable V10.8 source and real candidate ROM
        run: |
          mkdir -p artifacts/release
          cp LOST_COSMOS_V10_SOURCE/LOST_COSMOS_V10_OPENING_QA.gba artifacts/release/LOST_COSMOS_V10_8_CANDIDATE.gba
          python3 tools/package_current_source.py --out artifacts/release/LOST_COSMOS_V10_8_EDITABLE_SOURCE.zip
          (cd artifacts/release && sha256sum *.gba *.zip > SHA256SUMS.txt)
      - name: Verify all three real-game ending credits transitions with native C host
        run: python3 tests/test_end_credits_v10_8.py
      - name: Build controller bridge and test journal integrity
        run: |
          bash tools/mgba_build.sh
          gcc -std=c99 -Wall -Wextra -Werror -Wno-misleading-indentation -O2 tests/test_save_journal.c -o /tmp/lc-journal-test
          /tmp/lc-journal-test
      - name: Real mGBA controller boot, movement, audio, video and two-boot save check
        run: python3 tests/test_mgba_controller.py --out artifacts/mgba_controller
      - name: Bundle portable controller runtime
        if: always()
        run: |
          if test -f tools/mgba_bundle_runtime.py; then python3 tools/mgba_bundle_runtime.py --out artifacts/runner-runtime; fi
      - name: Collect native candidate
        if: always()
        run: |
          mkdir -p artifacts/native
          cp LOST_COSMOS_V10_SOURCE/LOST_COSMOS_V10_OPENING_QA.gba LOST_COSMOS_V10_SOURCE/lost_cosmos_v5.elf artifacts/native/
          llvm-size LOST_COSMOS_V10_SOURCE/lost_cosmos_v5.elf > artifacts/native/memory.txt
          sha256sum artifacts/native/* > artifacts/native/SHA256SUMS.txt
          git rev-parse HEAD > artifacts/native/COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lost-cosmos-native-${{ github.sha }}
          path: |
            gba/lost-cosmos-living-multiverse/artifacts/native/
            gba/lost-cosmos-living-multiverse/artifacts/release/
            gba/lost-cosmos-living-multiverse/artifacts/mgba_controller/
            gba/lost-cosmos-living-multiverse/artifacts/runtime-parts/parts.json
            gba/lost-cosmos-living-multiverse/artifacts/runtime-parts/REASSEMBLE.txt
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lost-cosmos-runtime-000-${{ github.sha }}
          path: gba/lost-cosmos-living-multiverse/artifacts/runtime-parts/runtime-part-000.bin
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lost-cosmos-runtime-001-${{ github.sha }}
          path: gba/lost-cosmos-living-multiverse/artifacts/runtime-parts/runtime-part-001.bin
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lost-cosmos-runtime-002-${{ github.sha }}
          path: gba/lost-cosmos-living-multiverse/artifacts/runtime-parts/runtime-part-002.bin
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lost-cosmos-runtime-003-${{ github.sha }}
          path: gba/lost-cosmos-living-multiverse/artifacts/runtime-parts/runtime-part-003.bin
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lost-cosmos-runtime-004-${{ github.sha }}
          path: gba/lost-cosmos-living-multiverse/artifacts/runtime-parts/runtime-part-004.bin
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lost-cosmos-runtime-005-${{ github.sha }}
          path: gba/lost-cosmos-living-multiverse/artifacts/runtime-parts/runtime-part-005.bin
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lost-cosmos-runtime-006-${{ github.sha }}
          path: gba/lost-cosmos-living-multiverse/artifacts/runtime-parts/runtime-part-006.bin
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lost-cosmos-runtime-007-${{ github.sha }}
          path: gba/lost-cosmos-living-multiverse/artifacts/runtime-parts/runtime-part-007.bin
          retention-days: 7
