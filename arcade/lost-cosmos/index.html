<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost Cosmos handheld</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #071018; color: #d7f6ff; font: 14px/1.45 ui-monospace, monospace; }
  header, main { padding: 12px 14px; }
  h1 { font-size: 15px; letter-spacing: .12em; margin: 0 0 6px; }
  p { margin: 0 0 8px; color: #9ec4d0; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
  button, label.file { background: #12323c; color: #e8ffff; border: 1px solid #2a6d7c; border-radius: 8px; padding: 8px 10px; font: inherit; cursor: pointer; }
  button:disabled { opacity: .45; }
  #traits { display: flex; flex-wrap: wrap; gap: 14px; margin: 8px 0; }
  #game { width: min(100%, 720px); height: clamp(240px, 60vw, 480px); background: #000; border-radius: 10px; overflow: hidden; }
  #status { min-height: 2.8em; color: #d7fff4; }
  label.consent { display: flex; gap: 8px; align-items: flex-start; }
</style>
</head>
<body>
<header>
  <h1>LOST COSMOS // LIVING LINK</h1>
  <p>Original homebrew cartridge in an isolated emulator. A living creature can cross over from this world. Raw sensor samples stay on this page and are not written into the save.</p>
</header>
<main>
  <label class="consent"><input id="consent" type="checkbox"> I agree to derive traits on this device. Samples are not stored in the cartridge.</label>
  <div id="traits"><span>FOCUS <b id="focus">—</b></span><span>CALM <b id="calm">—</b></span><span>SPARK <b id="spark">—</b></span></div>
  <div id="status" role="status" aria-live="polite">Waiting for this world.</div>
  <div class="row">
    <button id="mock" type="button">Simulated headband</button>
    <button id="muse" type="button">Muse headband</button>
    <button id="world" type="button">Use this living world</button>
    <label class="file">Beast Box JSON<input id="json" type="file" accept="application/json,.json" hidden></label>
    <label class="file">BCP1 profile<input id="bin" type="file" accept=".bin,application/octet-stream" hidden></label>
    <button id="bring" type="button">Bring creature in</button>
    <button id="play" type="button">Start cartridge</button>
  </div>
  <div id="game"></div>
</main>
<script type="module" src="./player.mjs"></script>
</body>
</html>
